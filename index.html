<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6 Dies</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            cursor: none;
        }
        
        /* Fondo completamente gris oscuro para móviles */
        .mobile-message {
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100vw;
            text-align: center;
            padding: 20px;
            background: #1a1a1a; 
            position: fixed;
            top: 0;
            left: 0;
            z-index: 99999;
        }
        
        /* Estilo del texto requerido */
        .mobile-text {
            color: #ffffff;
            font-size: 1.8rem;
            margin-bottom: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        
        .mobile-message img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }
        
        .desktop-content {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100%;
        }
        
        @media (max-width: 768px) {
            .mobile-message {
                display: flex;
            }
            .desktop-content {
                display: none;
            }
            body {
                cursor: auto;
                background: #1a1a1a;
            }
        }
        
        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        
        .cursor {
            position: fixed;
            width: 30px;
            height: 30px;
            border: 2px solid #00ffff;
            border-radius: 0;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.05s ease, border-color 0.3s ease;
            transform: rotate(45deg);
            box-shadow: 0 0 15px #00ffff, 0 0 30px #00ffff;
        }
        
        .cursor-follower {
            position: fixed;
            width: 50px;
            height: 50px;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 0;
            pointer-events: none;
            z-index: 9998;
            transition: transform 0.15s ease, width 0.3s ease, height 0.3s ease, background 0.3s ease;
            transform: rotate(45deg);
        }
        
        .cursor-ring {
            position: fixed;
            width: 80px;
            height: 80px;
            border: 2px solid rgba(138, 43, 226, 0.6);
            border-radius: 0;
            pointer-events: none;
            z-index: 9997;
            transition: transform 0.2s ease;
            transform: rotate(45deg);
            animation: ring-pulse 2s infinite ease-in-out;
        }
        
        .particle {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            animation: particle-fade 1.5s ease-out forwards;
        }
        
        @keyframes particle-fade {
            0% { opacity: 1; transform: scale(1) rotate(0deg); }
            100% { opacity: 0; transform: scale(0) rotate(360deg); }
        }
        
        .container {
            text-align: center;
            color: white;
            position: relative;
            z-index: 10;
        }
        
        h1 {
            font-size: 12rem;
            font-weight: 100;
            letter-spacing: 0.05em;
            position: relative;
            display: inline-block;
            cursor: none;
            transition: transform 0.1s ease;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 40px #00ffff, 0 0 80px #8a2be2;
            color: #ffffff;
            font-family: 'Courier New', monospace;
        }
        
        h1 span {
            display: inline-block;
            transition: all 0.2s ease;
            position: relative;
        }
        
        h1 span::before {
            content: attr(data-char);
            position: absolute;
            left: 0; top: 0;
            color: #e94560;
            opacity: 0;
            transition: all 0.2s ease;
            transform: translateY(0) scale(1);
        }
        
        h1 span::after {
            content: attr(data-char);
            position: absolute;
            left: 2px; top: 2px;
            color: #00ff88;
            opacity: 0;
            transition: all 0.2s ease;
            transform: translateY(0) scale(1);
            z-index: -1;
        }
        
        h1 span:hover::before { opacity: 1; transform: translateY(-20px) scale(1.5); filter: blur(4px); color: #8a2be2; }
        h1 span:hover::after { opacity: 0.8; transform: translateY(20px) scale(1.2); color: #00ffff; }
        h1 span:hover {
            transform: translateY(-15px) scale(1.3);
            color: #00ffff;
            text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff, 0 0 60px #8a2be2, 0 0 80px #8a2be2, 0 0 100px #00ffff;
            animation: glitch 0.3s infinite;
        }
        
        .glow-effect, .secondary-glow, .magnetic-field { position: fixed; pointer-events: none; z-index: 1; transform: translate(-50%, -50%); }
        .glow-effect { width: 500px; height: 500px; background: radial-gradient(circle, rgba(0, 255, 255, 0.3) 0%, rgba(138, 43, 226, 0.2) 30%, transparent 70%); filter: blur(40px); }
        .secondary-glow { width: 300px; height: 300px; background: radial-gradient(circle, rgba(255, 215, 0, 0.2) 0%, transparent 70%); filter: blur(25px); }
        .magnetic-field { width: 300px; height: 300px; border: 2px solid rgba(0, 255, 255, 0.2); transform: translate(-50%, -50%) rotate(45deg); animation: pulse 2s infinite ease-in-out; }
        
        .ripple { position: fixed; background: rgba(0, 255, 255, 0.3); pointer-events: none; z-index: 5; animation: ripple-effect 1.2s ease-out forwards; border: 3px solid rgba(0, 255, 255, 0.8); transform: rotate(45deg); }
        @keyframes ripple-effect { 0% { width: 0; height: 0; opacity: 1; } 100% { width: 200px; height: 200px; opacity: 0; } }
        
        .trail { position: fixed; width: 20px; height: 20px; background: linear-gradient(45deg, #00ffff, #8a2be2, #ffd700); pointer-events: none; z-index: 3; animation: trail-fade 1s ease-out forwards; box-shadow: 0 0 15px rgba(0, 255, 255, 0.8); transform: rotate(45deg); }
        @keyframes trail-fade { 0% { opacity: 1; transform: scale(1) rotate(0deg); } 100% { opacity: 0; transform: scale(0) rotate(180deg); } }
        
        .shockwave { position: fixed; border: 3px solid rgba(0, 255, 255, 0.9); pointer-events: none; z-index: 4; animation: shockwave-effect 1s ease-out forwards; transform: rotate(45deg); }
        @keyframes shockwave-effect { 0% { width: 0; height: 0; opacity: 1; } 100% { width: 300px; height: 300px; opacity: 0; } }
        
        .text-glow { position: fixed; pointer-events: none; z-index: 7; font-size: 2.5rem; font-weight: bold; color: rgba(0, 255, 255, 0.9); animation: text-glow-fade 1.2s ease-out forwards; text-shadow: 0 0 15px rgba(0, 255, 255, 0.9), 0 0 30px rgba(138, 43, 226, 0.7); }
        @keyframes text-glow-fade { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-50px) scale(1.5); } }
        
        .noise-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9; opacity: 0.03; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E"); }
        .vignette { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; background: radial-gradient(circle, transparent 40%, rgba(0, 0, 0, 0.8) 100%); }
        .scanline { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 11; background: repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.1) 1px, transparent 1px, transparent 2px); }
        @keyframes pulse { 0%, 100% { transform: translate(-50%, -50%) rotate(45deg) scale(1); opacity: 0.5; } 50% { transform: translate(-50%, -50%) rotate(45deg) scale(1.4); opacity: 0.2; } }
        @keyframes glitch { 0% { transform: translate(0); } 20% { transform: translate(-2px, 2px); } 40% { transform: translate(-2px, -2px); } 60% { transform: translate(2px, 2px); } 80% { transform: translate(2px, -2px); } 100% { transform: translate(0); } }
        @keyframes ring-pulse { 0%, 100% { opacity: 0.6; transform: rotate(45deg) scale(1); } 50% { opacity: 0.3; transform: rotate(45deg) scale(1.2); } }
    </style>
</head>
<body>
    <div class="mobile-message">
        <div class="mobile-text">en el movil no</div>
        <div id="camera-container" style="
            width: 300px;
            height: 300px;
            background: #2b2b2b;
            border: 3px solid #555555;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        ">
            <video id="camera-video" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover; display: none;"></video>
            <canvas id="camera-canvas" style="display: none;"></canvas>
            <img id="camera-photo" style="width: 100%; height: 100%; object-fit: contain; display: none;">
        </div>
    </div>
    
    <div class="desktop-content">
        <canvas id="canvas-bg"></canvas>
        <div class="noise-overlay"></div>
        <div class="vignette"></div>
        <div class="scanline"></div>
        
        <div class="cursor"></div>
        <div class="cursor-follower"></div>
        <div class="cursor-ring"></div>
        <div class="glow-effect"></div>
        <div class="secondary-glow"></div>
        <div class="magnetic-field"></div>
        
        <div class="container">
            <h1>
                <span data-char="6">6</span>
                <span data-char=" "> </span>
                <span data-char="d">d</span>
                <span data-char="i">i</span>
                <span data-char="e">e</span>
                <span data-char="s">s</span>
            </h1>
        </div>
    </div>
    
    <script>
        const cameraAudio = new Audio('camera_fotos.mp3');
        const spongebobAudio = new Audio('spongebob-sad-song.mp3');

        function unlockAudio() {
            cameraAudio.play().then(() => { cameraAudio.pause(); cameraAudio.currentTime = 0; });
            spongebobAudio.play().then(() => { spongebobAudio.pause(); spongebobAudio.currentTime = 0; });
            window.removeEventListener('click', unlockAudio);
            window.removeEventListener('touchstart', unlockAudio);
        }
        window.addEventListener('click', unlockAudio);
        window.addEventListener('touchstart', unlockAudio);

        // Grid Canvas para Escritorio
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let width, height, gridPoints = [], mouseX = 0, mouseY = 0, targetMouseX = 0, targetMouseY = 0, time = 0;
        const gridSize = 40;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initGrid();
        }
        
        function initGrid() {
            gridPoints = [];
            const cols = Math.ceil(width / gridSize) + 2, rows = Math.ceil(height / gridSize) + 2;
            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    gridPoints.push({ baseX: (i - 1) * gridSize, baseY: (j - 1) * gridSize, x: (i - 1) * gridSize, y: (j - 1) * gridSize, vx: 0, vy: 0 });
                }
            }
        }
        
        function drawGrid() {
            ctx.fillStyle = 'rgba(10, 10, 26, 0.2)';
            ctx.fillRect(0, 0, width, height);
            mouseX += (targetMouseX - mouseX) * 0.08;
            mouseY += (targetMouseY - mouseY) * 0.08;
            time += 0.02;
            
            const cols = Math.ceil(width / gridSize) + 2, rows = Math.ceil(height / gridSize) + 2;
            gridPoints.forEach(point => {
                const dx = mouseX - point.baseX, dy = mouseY - point.baseY, distance = Math.sqrt(dx * dx + dy * dy);
                const waveEffect = Math.sin(distance * 0.02 - time * 3) * 30;
                let repulsionX = 0, repulsionY = 0;
                if (distance < 200) {
                    const force = (200 - distance) / 200;
                    repulsionX = -(dx / distance) * force * 60;
                    repulsionY = -(dy / distance) * force * 60;
                }
                point.vx += (repulsionX - (point.x - point.baseX)) * 0.1;
                point.vy += (repulsionY + waveEffect - (point.y - point.baseY)) * 0.1;
                point.vx *= 0.85; point.vy *= 0.85;
                point.x = point.baseX + point.vx; point.y = point.baseY + point.vy;
            });
            
            ctx.lineWidth = 1;
            for (let j = 0; j < rows; j++) {
                ctx.beginPath();
                for (let i = 0; i < cols; i++) {
                    const point = gridPoints[i * rows + j];
                    if (i === 0) ctx.moveTo(point.x, point.y); else ctx.lineTo(point.x, point.y);
                }
                ctx.strokeStyle = 'rgba(138, 43, 226, 0.15)';
                ctx.stroke();
            }
            requestAnimationFrame(drawGrid);
        }
        
        window.addEventListener('resize', resize);
        resize(); drawGrid();
        
        // Cursor Animaciones Escritorio
        const cursor = document.querySelector('.cursor'), cursorFollower = document.querySelector('.cursor-follower'), cursorRing = document.querySelector('.cursor-ring'), glowEffect = document.querySelector('.glow-effect'), secondaryGlow = document.querySelector('.secondary-glow'), magneticField = document.querySelector('.magnetic-field');
        let cursorX = 0, cursorY = 0, followerX = 0, followerY = 0, ringX = 0, ringY = 0;
        
        document.addEventListener('mousemove', (e) => { targetMouseX = e.clientX; targetMouseY = e.clientY; });
        function animateCursor() {
            cursorX += (targetMouseX - cursorX) * 0.3; cursorY += (targetMouseY - cursorY) * 0.3;
            followerX += (targetMouseX - followerX) * 0.15; followerY += (targetMouseY - followerY) * 0.15;
            ringX += (targetMouseX - ringX) * 0.08; ringY += (targetMouseY - ringY) * 0.08;
            cursor.style.left = cursorX - 15 + 'px'; cursor.style.top = cursorY - 15 + 'px';
            cursorFollower.style.left = followerX - 25 + 'px'; cursorFollower.style.top = followerY - 25 + 'px';
            cursorRing.style.left = ringX - 40 + 'px'; cursorRing.style.top = ringY - 40 + 'px';
            if(glowEffect) { glowEffect.style.left = targetMouseX + 'px'; glowEffect.style.top = targetMouseY + 'px'; }
            if(secondaryGlow) { secondaryGlow.style.left = targetMouseX + 'px'; secondaryGlow.style.top = targetMouseY + 'px'; }
            if(magneticField) { magneticField.style.left = targetMouseX + 'px'; magneticField.style.top = targetMouseY + 'px'; }
            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        // Cámara Móvil
        const cameraVideo = document.getElementById('camera-video');
        const cameraCanvas = document.getElementById('camera-canvas');
        const cameraPhoto = document.getElementById('camera-photo');
        let stream = null;
        
        async function initCamera() {
            if (window.innerWidth < 768) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                    cameraVideo.srcObject = stream;
                    cameraVideo.style.display = 'block';
                    cameraVideo.onloadedmetadata = () => { setTimeout(takePhoto, 500); };
                } catch (err) {
                    console.error('Error cámara:', err);
                }
            }
        }
        
        function takePhoto() {
            cameraCanvas.width = cameraVideo.videoWidth;
            cameraCanvas.height = cameraVideo.videoHeight;
            const ctx = cameraCanvas.getContext('2d');
            ctx.drawImage(cameraVideo, 0, 0);
            
            cameraPhoto.src = cameraCanvas.toDataURL('image/png');
            cameraPhoto.style.display = 'block';
            cameraVideo.style.display = 'none';
            
            if (stream) stream.getTracks().forEach(track => track.stop());
            
            cameraAudio.play().catch(e => console.log("Audio en espera"));
            setTimeout(() => { spongebobAudio.play().catch(e => console.log("Audio en espera")); }, 500);
        }
        
        window.addEventListener('load', initCamera);
    </script>
</body>
</html>
