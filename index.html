<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6 Dies</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a1a2e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            cursor: none;
        }
        
        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        
        .cursor {
            position: fixed;
            width: 30px;
            height: 30px;
            border: 2px solid #00ffff;
            border-radius: 0;
            pointer-events: none;
            z-index: 9999;
            transition: transform 0.05s ease, border-color 0.3s ease;
            transform: rotate(45deg);
            box-shadow: 0 0 15px #00ffff, 0 0 30px #00ffff;
        }
        
        .cursor-follower {
            position: fixed;
            width: 50px;
            height: 50px;
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.3);
            border-radius: 0;
            pointer-events: none;
            z-index: 9998;
            transition: transform 0.15s ease, width 0.3s ease, height 0.3s ease, background 0.3s ease;
            transform: rotate(45deg);
        }
        
        .cursor-ring {
            position: fixed;
            width: 80px;
            height: 80px;
            border: 2px solid rgba(138, 43, 226, 0.6);
            border-radius: 0;
            pointer-events: none;
            z-index: 9997;
            transition: transform 0.2s ease;
            transform: rotate(45deg);
            animation: ring-pulse 2s infinite ease-in-out;
        }
        
        .particle {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            animation: particle-fade 1.5s ease-out forwards;
        }
        
        @keyframes particle-fade {
            0% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: scale(0) rotate(360deg);
            }
        }
        
        .container {
            text-align: center;
            color: white;
            position: relative;
            z-index: 10;
        }
        
        h1 {
            font-size: 12rem;
            font-weight: 100;
            letter-spacing: 0.05em;
            position: relative;
            display: inline-block;
            cursor: none;
            transition: transform 0.1s ease;
            text-shadow: 
                0 0 10px #00ffff,
                0 0 20px #00ffff,
                0 0 40px #00ffff,
                0 0 80px #8a2be2;
            color: #ffffff;
            font-family: 'Courier New', monospace;
        }
        
        h1 span {
            display: inline-block;
            transition: all 0.2s ease;
            position: relative;
        }
        
        h1 span::before {
            content: attr(data-char);
            position: absolute;
            left: 0;
            top: 0;
            color: #e94560;
            opacity: 0;
            transition: all 0.2s ease;
            transform: translateY(0) scale(1);
            filter: blur(0);
        }
        
        h1 span::after {
            content: attr(data-char);
            position: absolute;
            left: 2px;
            top: 2px;
            color: #00ff88;
            opacity: 0;
            transition: all 0.2s ease;
            transform: translateY(0) scale(1);
            z-index: -1;
        }
        
        h1 span:hover::before {
            opacity: 1;
            transform: translateY(-20px) scale(1.5);
            filter: blur(4px);
            color: #8a2be2;
        }
        
        h1 span:hover::after {
            opacity: 0.8;
            transform: translateY(20px) scale(1.2);
            color: #00ffff;
        }
        
        h1 span:hover {
            transform: translateY(-15px) scale(1.3);
            color: #00ffff;
            text-shadow: 
                0 0 20px #00ffff,
                0 0 40px #00ffff,
                0 0 60px #8a2be2,
                0 0 80px #8a2be2,
                0 0 100px #00ffff;
            animation: glitch 0.3s infinite;
        }
        
        .glow-effect {
            position: fixed;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 255, 255, 0.3) 0%, rgba(138, 43, 226, 0.2) 30%, transparent 70%);
            pointer-events: none;
            z-index: 1;
            transform: translate(-50%, -50%);
            transition: opacity 0.3s ease;
            filter: blur(40px);
        }
        
        .secondary-glow {
            position: fixed;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.2) 0%, transparent 70%);
            pointer-events: none;
            z-index: 1;
            transform: translate(-50%, -50%);
            filter: blur(25px);
        }
        
        .ripple {
            position: fixed;
            border-radius: 0;
            background: rgba(0, 255, 255, 0.3);
            pointer-events: none;
            z-index: 5;
            animation: ripple-effect 1.2s ease-out forwards;
            border: 3px solid rgba(0, 255, 255, 0.8);
            transform: rotate(45deg);
        }
        
        @keyframes ripple-effect {
            0% {
                width: 0;
                height: 0;
                opacity: 1;
            }
            100% {
                width: 200px;
                height: 200px;
                opacity: 0;
            }
        }
        
        .magnetic-field {
            position: fixed;
            width: 300px;
            height: 300px;
            border: 2px solid rgba(0, 255, 255, 0.2);
            border-radius: 0;
            pointer-events: none;
            z-index: 2;
            transform: translate(-50%, -50%) rotate(45deg);
            animation: pulse 2s infinite ease-in-out;
        }
        
        .magnetic-field::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            width: 200px;
            height: 200px;
            border: 1px solid rgba(138, 43, 226, 0.4);
            border-radius: 0;
            animation: pulse-reverse 2s infinite ease-in-out;
        }
        
        @keyframes pulse {
            0%, 100% {
                transform: translate(-50%, -50%) rotate(45deg) scale(1);
                opacity: 0.5;
            }
            50% {
                transform: translate(-50%, -50%) rotate(45deg) scale(1.4);
                opacity: 0.2;
            }
        }
        
        @keyframes pulse-reverse {
            0%, 100% {
                transform: translate(-50%, -50%) rotate(45deg) scale(1);
                opacity: 0.4;
            }
            50% {
                transform: translate(-50%, -50%) rotate(45deg) scale(0.6);
                opacity: 0.1;
            }
        }
        
        .trail {
            position: fixed;
            width: 20px;
            height: 20px;
            background: linear-gradient(45deg, #00ffff, #8a2be2, #ffd700);
            border-radius: 0;
            pointer-events: none;
            z-index: 3;
            animation: trail-fade 1s ease-out forwards;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.8);
            transform: rotate(45deg);
        }
        
        @keyframes trail-fade {
            0% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: scale(0) rotate(180deg);
            }
        }
        
        .shockwave {
            position: fixed;
            border-radius: 0;
            border: 3px solid rgba(0, 255, 255, 0.9);
            pointer-events: none;
            z-index: 4;
            animation: shockwave-effect 1s ease-out forwards;
            transform: rotate(45deg);
        }
        
        @keyframes shockwave-effect {
            0% {
                width: 0;
                height: 0;
                opacity: 1;
            }
            100% {
                width: 300px;
                height: 300px;
                opacity: 0;
            }
        }
        
        .energy-burst {
            position: fixed;
            pointer-events: none;
            z-index: 6;
            animation: energy-burst-effect 0.7s ease-out forwards;
            border-radius: 0;
        }
        
        @keyframes energy-burst-effect {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: scale(2) rotate(180deg);
                opacity: 0;
            }
        }
        
        .text-glow {
            position: fixed;
            pointer-events: none;
            z-index: 7;
            font-size: 2.5rem;
            font-weight: bold;
            color: rgba(0, 255, 255, 0.9);
            animation: text-glow-fade 1.2s ease-out forwards;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.9), 0 0 30px rgba(138, 43, 226, 0.7);
            font-family: 'Courier New', monospace;
        }
        
        @keyframes text-glow-fade {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-50px) scale(1.5);
            }
        }
        
        .geometric-shape {
            position: fixed;
            pointer-events: none;
            z-index: 8;
            animation: geometric-spin 2.5s linear infinite;
            border-radius: 0;
        }
        
        @keyframes geometric-spin {
            0% {
                transform: rotate(0deg) scale(1);
            }
            50% {
                transform: rotate(180deg) scale(1.3);
            }
            100% {
                transform: rotate(360deg) scale(1);
            }
        }
        
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
        
        @keyframes ring-pulse {
            0%, 100% {
                opacity: 0.6;
                transform: rotate(45deg) scale(1);
            }
            50% {
                opacity: 0.3;
                transform: rotate(45deg) scale(1.2);
            }
        }
        
        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }
        
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            background: radial-gradient(circle, transparent 40%, rgba(0, 0, 0, 0.8) 100%);
        }
        
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 11;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1),
                rgba(0, 0, 0, 0.1) 1px,
                transparent 1px,
                transparent 2px
            );
        }
    </style>
</head>
<body>
    <canvas id="canvas-bg"></canvas>
    
    <div class="noise-overlay"></div>
    <div class="vignette"></div>
    <div class="scanline"></div>
    
    <div class="cursor" style="left: 1515.95px; top: 603.998px;"></div>
    <div class="cursor-follower" style="left: 1503.82px; top: 593.851px;"></div>
    <div class="cursor-ring" style="left: 1474.3px; top: 583.559px;"></div>
    <div class="glow-effect" style="left: 1526px; top: 614px;"></div>
    <div class="secondary-glow" style="left: 1526px; top: 614px;"></div>
    <div class="magnetic-field" style="left: 1526px; top: 614px;"></div>
    
    <div class="container" style="left: -19px; top: -2px;">
        <h1>
            <span data-char="6">6</span>
            <span data-char=" "> </span>
            <span data-char="d">d</span>
            <span data-char="i">i</span>
            <span data-char="e">e</span>
            <span data-char="s">s</span>
        </h1>
    </div>
    
    <script>
        // Canvas background con grid distorsionado interactivo
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let gridPoints = [];
        let mouseX = 0, mouseY = 0;
        let targetMouseX = 0, targetMouseY = 0;
        let time = 0;
        
        const gridSize = 40;
        
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initGrid();
        }
        
        function initGrid() {
            gridPoints = [];
            const cols = Math.ceil(width / gridSize) + 2;
            const rows = Math.ceil(height / gridSize) + 2;
            
            for (let i = 0; i < cols; i++) {
                for (let j = 0; j < rows; j++) {
                    gridPoints.push({
                    baseX: (i - 1) * gridSize,
                    baseY: (j - 1) * gridSize,
                    x: (i - 1) * gridSize,
                    y: (j - 1) * gridSize,
                    vx: 0,
                    vy: 0,
                    phase: Math.random() * Math.PI * 2
                    });
                }
            }
        }
        
        function drawGrid() {
            ctx.fillStyle = 'rgba(10, 10, 26, 0.2)';
            ctx.fillRect(0, 0, width, height);
            
            // Actualizar posición del ratón con suavizado
            mouseX += (targetMouseX - mouseX) * 0.08;
            mouseY += (targetMouseY - mouseY) * 0.08;
            
            time += 0.02;
            
            const cols = Math.ceil(width / gridSize) + 2;
            const rows = Math.ceil(height / gridSize) + 2;
            
            // Actualizar puntos del grid
            gridPoints.forEach(point => {
                const dx = mouseX - point.baseX;
                const dy = mouseY - point.baseY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                // Onda desde el ratón
                const waveEffect = Math.sin(distance * 0.02 - time * 3) * 30;
                
                // Repulsión del ratón
                let repulsionX = 0, repulsionY = 0;
                if (distance < 200) {
                    const force = (200 - distance) / 200;
                    repulsionX = -(dx / distance) * force * 60;
                    repulsionY = -(dy / distance) * force * 60;
                }
                
                // Movimiento ondulatorio base
                const waveX = Math.sin(point.baseY * 0.01 + time) * 15;
                const waveY = Math.cos(point.baseX * 0.01 + time) * 15;
                
                // Aplicar fuerzas con suavizado
                point.vx += (repulsionX + waveX - (point.x - point.baseX)) * 0.1;
                point.vy += (repulsionY + waveY + waveEffect - (point.y - point.baseY)) * 0.1;
                point.vx *= 0.85;
                point.vy *= 0.85;
                
                point.x = point.baseX + point.vx;
                point.y = point.baseY + point.vy;
            });
            
            // Dibujar líneas del grid
            ctx.lineWidth = 1;
            
            // Líneas horizontales
            for (let j = 0; j < rows; j++) {
                ctx.beginPath();
                for (let i = 0; i < cols; i++) {
                    const point = gridPoints[i * rows + j];
                    if (i === 0) {
                        ctx.moveTo(point.x, point.y);
                    } else {
                        ctx.lineTo(point.x, point.y);
                    }
                }
                
                const gradient = ctx.createLinearGradient(0, j * gridSize, width, j * gridSize);
                gradient.addColorStop(0, 'rgba(0, 255, 255, 0.1)');
                gradient.addColorStop(0.5, 'rgba(138, 43, 226, 0.3)');
                gradient.addColorStop(1, 'rgba(0, 255, 255, 0.1)');
                ctx.strokeStyle = gradient;
                ctx.stroke();
            }
            
            // Líneas verticales
            for (let i = 0; i < cols; i++) {
                ctx.beginPath();
                for (let j = 0; j < rows; j++) {
                    const point = gridPoints[i * rows + j];
                    if (j === 0) {
                        ctx.moveTo(point.x, point.y);
                    } else {
                        ctx.lineTo(point.x, point.y);
                    }
                }
                
                const gradient = ctx.createLinearGradient(i * gridSize, 0, i * gridSize, height);
                gradient.addColorStop(0, 'rgba(255, 215, 0, 0.1)');
                gradient.addColorStop(0.5, 'rgba(0, 255, 255, 0.3)');
                gradient.addColorStop(1, 'rgba(255, 215, 0, 0.1)');
                ctx.strokeStyle = gradient;
                ctx.stroke();
            }
            
            // Dibujar puntos de intersección
            gridPoints.forEach(point => {
                const dx = mouseX - point.x;
                const dy = mouseY - point.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < 150) {
                    const alpha = 1 - distance / 150;
                    ctx.beginPath();
                    ctx.arc(point.x, point.y, 3 * alpha, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 255, 255, ${alpha})`;
                    ctx.fill();
                    
                    ctx.shadowBlur = 10;
                    ctx.shadowColor = '#00ffff';
                }
            });
            
            ctx.shadowBlur = 0;
            
            // Efecto de pulso desde el ratón
            const pulseRadius = (Math.sin(time * 2) * 0.5 + 0.5) * 100 + 50;
            ctx.beginPath();
            ctx.arc(mouseX, mouseY, pulseRadius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(138, 43, 226, 0.2)';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            requestAnimationFrame(drawGrid);
        }
        
        window.addEventListener('resize', resize);
        resize();
        drawGrid();
        
        // Cursor personalizado
        const cursor = document.querySelector('.cursor');
        const cursorFollower = document.querySelector('.cursor-follower');
        const cursorRing = document.querySelector('.cursor-ring');
        const glowEffect = document.querySelector('.glow-effect');
        const secondaryGlow = document.querySelector('.secondary-glow');
        const magneticField = document.querySelector('.magnetic-field');
        
        let cursorX = 0, cursorY = 0;
        let followerX = 0, followerY = 0;
        let ringX = 0, ringY = 0;
        
        document.addEventListener('mousemove', (e) => {
            targetMouseX = e.clientX;
            targetMouseY = e.clientY;
        });
        
        function animateCursor() {
            cursorX += (targetMouseX - cursorX) * 0.3;
            cursorY += (targetMouseY - cursorY) * 0.3;
            followerX += (targetMouseX - followerX) * 0.15;
            followerY += (targetMouseY - followerY) * 0.15;
            ringX += (targetMouseX - ringX) * 0.08;
            ringY += (targetMouseY - ringY) * 0.08;
            
            cursor.style.left = cursorX - 10 + 'px';
            cursor.style.top = cursorY - 10 + 'px';
            cursorFollower.style.left = followerX - 20 + 'px';
            cursorFollower.style.top = followerY - 20 + 'px';
            cursorRing.style.left = ringX - 30 + 'px';
            cursorRing.style.top = ringY - 30 + 'px';
            glowEffect.style.left = targetMouseX + 'px';
            glowEffect.style.top = targetMouseY + 'px';
            secondaryGlow.style.left = targetMouseX + 'px';
            secondaryGlow.style.top = targetMouseY + 'px';
            magneticField.style.left = targetMouseX + 'px';
            magneticField.style.top = targetMouseY + 'px';
            
            requestAnimationFrame(animateCursor);
        }
        animateCursor();
        
        // Efectos click
        document.addEventListener('click', (e) => {
            createRipple(e.clientX, e.clientY);
            createShockwave(e.clientX, e.clientY);
            createParticles(e.clientX, e.clientY, 15);
            createEnergyBurst(e.clientX, e.clientY);
            createTextGlow(e.clientX, e.clientY);
            createGeometricShapes(e.clientX, e.clientY);
        });
        
        function createRipple(x, y) {
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            ripple.style.left = x - 100 + 'px';
            ripple.style.top = y - 100 + 'px';
            document.body.appendChild(ripple);
            setTimeout(() => ripple.remove(), 1000);
        }
        
        function createShockwave(x, y) {
            const shockwave = document.createElement('div');
            shockwave.className = 'shockwave';
            shockwave.style.left = x - 150 + 'px';
            shockwave.style.top = y - 150 + 'px';
            document.body.appendChild(shockwave);
            setTimeout(() => shockwave.remove(), 800);
        }
        
        function createEnergyBurst(x, y) {
            const burst = document.createElement('div');
            burst.className = 'energy-burst';
            burst.style.left = x - 60 + 'px';
            burst.style.top = y - 60 + 'px';
            burst.style.width = '120px';
            burst.style.height = '120px';
            burst.style.background = `radial-gradient(circle, rgba(0, 255, 255, 0.6) 0%, rgba(138, 43, 226, 0.4) 50%, transparent 70%)`;
            burst.style.border = '2px solid rgba(0, 255, 255, 0.8)';
            document.body.appendChild(burst);
            setTimeout(() => burst.remove(), 700);
        }
        
        function createTextGlow(x, y) {
            const texts = ['6', 'dies', '!', '✦', '◈'];
            const text = texts[Math.floor(Math.random() * texts.length)];
            const textGlow = document.createElement('div');
            textGlow.className = 'text-glow';
            textGlow.textContent = text;
            textGlow.style.left = x + 'px';
            textGlow.style.top = y + 'px';
            document.body.appendChild(textGlow);
            setTimeout(() => textGlow.remove(), 1000);
        }
        
        function createGeometricShapes(x, y) {
            for (let i = 0; i < 7; i++) {
                const shape = document.createElement('div');
                shape.className = 'geometric-shape';
                const size = Math.random() * 40 + 15;
                shape.style.width = size + 'px';
                shape.style.height = size + 'px';
                shape.style.left = x + (Math.random() - 0.5) * 150 + 'px';
                shape.style.top = y + (Math.random() - 0.5) * 150 + 'px';
                shape.style.border = `3px solid ${['#00ffff', '#8a2be2', '#ffd700'][Math.floor(Math.random() * 3)]}`;
                shape.style.animationDelay = i * 0.15 + 's';
                shape.style.boxShadow = `0 0 10px ${shape.style.borderColor}`;
                document.body.appendChild(shape);
                setTimeout(() => shape.remove(), 2500);
            }
        }
        
        // Partículas al mover el ratón
        let particleCount = 0;
        document.addEventListener('mousemove', (e) => {
            if (particleCount % 2 === 0) {
                createParticle(e.clientX, e.clientY);
            }
            if (particleCount % 3 === 0) {
                createTrail(e.clientX, e.clientY);
            }
            particleCount++;
        });
        
        function createParticle(x, y) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            
            const size = Math.random() * 12 + 4;
            const colors = ['#00ffff', '#8a2be2', '#ffd700', '#ff00ff', '#00ff00'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.background = color;
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            particle.style.boxShadow = `0 0 ${size * 4}px ${color}, 0 0 ${size * 8}px ${color}`;
            particle.style.borderRadius = '0';
            particle.style.transform = 'rotate(45deg)';
            
            const angle = Math.random() * Math.PI * 2;
            const velocity = Math.random() * 100 + 40;
            const vx = Math.cos(angle) * velocity;
            const vy = Math.sin(angle) * velocity;
            
            particle.style.transform = `translate(${vx}px, ${vy}px) rotate(45deg)`;
            
            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 1800);
        }
        
        function createParticles(x, y, count) {
            for (let i = 0; i < count; i++) {
                setTimeout(() => createParticle(x, y), i * 15);
            }
        }
        
        function createTrail(x, y) {
            const trail = document.createElement('div');
            trail.className = 'trail';
            trail.style.left = x - 7.5 + 'px';
            trail.style.top = y - 7.5 + 'px';
            document.body.appendChild(trail);
            setTimeout(() => trail.remove(), 800);
        }
        
        // Efecto hover en letras
        const letters = document.querySelectorAll('h1 span');
        letters.forEach(letter => {
            letter.addEventListener('mouseenter', () => {
                cursorFollower.style.width = '100px';
                cursorFollower.style.height = '100px';
                cursorFollower.style.background = 'rgba(0, 255, 255, 0.3)';
                cursorFollower.style.borderColor = 'rgba(0, 255, 255, 0.6)';
                cursorRing.style.width = '120px';
                cursorRing.style.height = '120px';
                cursorRing.style.borderColor = 'rgba(138, 43, 226, 0.9)';
                cursor.style.borderColor = '#ffd700';
                cursor.style.boxShadow = '0 0 20px #ffd700, 0 0 40px #ffd700';
            });
            
            letter.addEventListener('mouseleave', () => {
                cursorFollower.style.width = '50px';
                cursorFollower.style.height = '50px';
                cursorFollower.style.background = 'rgba(0, 255, 255, 0.1)';
                cursorFollower.style.borderColor = 'rgba(0, 255, 255, 0.3)';
                cursorRing.style.width = '80px';
                cursorRing.style.height = '80px';
                cursorRing.style.borderColor = 'rgba(138, 43, 226, 0.6)';
                cursor.style.borderColor = '#00ffff';
                cursor.style.boxShadow = '0 0 15px #00ffff, 0 0 30px #00ffff';
            });
        });
        
        // Efecto magnético en el texto eliminado
        
        // Efecto de doble click
        let lastClick = 0;
        document.addEventListener('dblclick', (e) => {
            for (let i = 0; i < 30; i++) {
                setTimeout(() => {
                    createParticle(e.clientX + (Math.random() - 0.5) * 100, e.clientY + (Math.random() - 0.5) * 100);
                }, i * 20);
            }
        });
    </script>
</body>
</html>
